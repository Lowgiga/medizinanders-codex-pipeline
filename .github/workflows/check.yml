name: Manuelle Pipeline-Prüfung
# Nur ausdrücklich starten; kein kostenpflichtiger automatischer Produktionslauf.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-lock.txt -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py
      - run: ma --home /tmp/ma-demo demo --with-video

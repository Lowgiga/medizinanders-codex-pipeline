[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medizinanders-codex-pipeline"
version = "1.0.0"
description = "Lokale Codex-native MedizinAnders-Pipeline mit menschlichen Freigaben"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.20,<5", "Pillow>=10,<13"]

[project.scripts]
ma = "medizinanders.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
